# Supabase local development config.
# https://supabase.com/docs/guides/local-development/cli/config
#
# Scaffold only (PR0) — auth/db sections get filled in as PR1 (DB Foundation)
# and PR2 (identity-bridge / Third-Party Auth JWKS) land.

project_id = "red-aliados"

[api]
enabled = true
port = 54321
schemas = ["public", "app"]
extra_search_path = ["public", "app"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false

[edge_runtime]
enabled = true

[functions.ingest-vehicle-event]
verify_jwt = false

[functions.reconcile-outbox]
verify_jwt = false
